{% set name = "unittest2pytest" %}
{% set version = "0.6" %}
{% set hash = "3db99de0e807923e16cbf58533bdbef7ff414fedf9bbfd5866dbf230534038e7" %}
{% set ext = "tar.gz" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  fn: {{ name }}-{{ version }}.{{ ext }}
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ ext }}
  sha256: {{ hash }}

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  noarch: python
  entry_points:
    - unittest2pytest = unittest2pytest.__main__:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - fissix

test:
  requires:
    - python {{ python_min }}
  commands:
    - unittest2pytest --help

about:
  home: https://github.com/pytest-dev/unittest2pytest
  license: AGPL-3.0-only
  license_file: COPYING-GPLv3.txt
  summary: unittest2pytest is a tool that helps rewriting Python unittest test-cases into pytest test-cases.

extra:
  recipe-maintainers:
    - nicoddemus
    - gqmelo
